:root { --chao: #03050a; --painel: #0a101b; --linha: rgba(170, 205, 245, .22); --texto: #e7edf5; --suave: #9babbf;

p { margin: 0 0 22px; color: var(--suave); }
a.botao { display: inline-block; width: 100%; padding: 14px 18px; border-radius: 12px; background: var(--holo); color: var(--sobre-holo);
  font-weight: 700; font-size: 17px; text-decoration: none; }
a.botao:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
</style>
